version: '3.8'

services:
  mongodb:
    image: mongo:5.0
    container_name: job-marketplace-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: jobmarketplace123
    volumes:
      - mongodb_data:/data/db
    networks:
      - job-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job-marketplace-backend
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:jobmarketplace123@mongodb:27017/job-marketplace?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      FRONTEND_URL: http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - job-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: job-marketplace-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - job-network

volumes:
  mongodb_data:

networks:
  job-network:
    driver: bridge
